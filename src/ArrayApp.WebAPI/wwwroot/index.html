  <style>

    body { font-family: 'Plus Jakarta Sans', sans-serif; }

<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Maturity Stages Definition
    const STAGES = [
      { id: 0, name: 'Raw', color: 'bg-slate-800 text-slate-300 border-slate-700' },
      { id: 1, name: 'Exploring', color: 'bg-blue-950 text-blue-300 border-blue-800' },
      { id: 2, name: 'Structured', color: 'bg-indigo-950 text-indigo-300 border-indigo-800' },
      { id: 3, name: 'Validating', color: 'bg-purple-950 text-purple-300 border-purple-800' },
      { id: 4, name: 'Experimenting', color: 'bg-pink-950 text-pink-300 border-pink-800' },
      { id: 5, name: 'Planned', color: 'bg-amber-950 text-amber-300 border-amber-800' },
      { id: 6, name: 'Building', color: 'bg-emerald-950 text-emerald-300 border-emerald-800' },
      { id: 7, name: 'Implemented', color: 'bg-teal-950 text-teal-300 border-teal-800' },
      { id: 8, name: 'Measured', color: 'bg-cyan-950 text-cyan-300 border-cyan-800' },
      { id: 9, name: 'Evolving', color: 'bg-sky-950 text-sky-300 border-sky-800' }
    ];

    // Participant Roles Definition
    const ROLES = [
      { id: 'Student', name: 'Student', desc: 'Learner & Inquisitor', icon: 'fa-graduation-cap', color: 'text-amber-400 bg-amber-950/60 border-amber-800/60' },
      { id: 'Sponsor', name: 'Sponsor', desc: 'Funder & Resource Patron', icon: 'fa-gem', color: 'text-purple-400 bg-purple-950/60 border-purple-800/60' },
      { id: 'Professional', name: 'Professional / Expert', desc: 'Domain Specialist', icon: 'fa-microscope', color: 'text-blue-400 bg-blue-950/60 border-blue-800/60' },
      { id: 'Authority', name: 'Authority', desc: 'Regulator & Sign-off', icon: 'fa-landmark', color: 'text-rose-400 bg-rose-950/60 border-rose-800/60' },
      { id: 'Actioner', name: 'Actioner', desc: 'Execution & Engineering Lead', icon: 'fa-screwdriver-wrench', color: 'text-emerald-400 bg-emerald-950/60 border-emerald-800/60' },
      { id: 'Audience', name: 'Audience', desc: 'Observer & Feedback Tester', icon: 'fa-users', color: 'text-slate-300 bg-slate-800/60 border-slate-700/60' }
    ];

    // Connectors Definition
    const CONNECTOR_BADGES = {
      Jira: { name: 'Jira', color: 'bg-blue-900/60 text-blue-300 border-blue-700', icon: 'fa-square-check' },
      GitHub: { name: 'GitHub', color: 'bg-slate-800 text-slate-200 border-slate-700', icon: 'fa-brands fa-github' },
      Trello: { name: 'Trello', color: 'bg-sky-900/60 text-sky-300 border-sky-700', icon: 'fa-trello' },
      Asana: { name: 'Asana', color: 'bg-rose-900/60 text-rose-300 border-rose-700', icon: 'fa-circle-dot' },
      Linear: { name: 'Linear', color: 'bg-purple-900/60 text-purple-300 border-purple-700', icon: 'fa-cubes' },
      Slack: { name: 'Slack', color: 'bg-emerald-900/60 text-emerald-300 border-emerald-700', icon: 'fa-slack' },
      Monday: { name: 'Monday', color: 'bg-amber-900/60 text-amber-300 border-amber-700', icon: 'fa-chart-simple' }
    };

    function App() {
      const [currentTab, setCurrentTab] = useState('session'); // default to live workshop
      const [currentUser, setCurrentUser] = useState({ id: 'user-elena', name: 'Dr. Elena Vance', role: 'Professional' });
      const [ideas, setIdeas] = useState([]);
      const [selectedIdea, setSelectedIdea] = useState(null);
      const [showExtractModal, setShowExtractModal] = useState(false);
      const [showNewIdeaModal, setShowNewIdeaModal] = useState(false);
      const [syncAlert, setSyncAlert] = useState(null);

      // Live Virtual Workshop State
      const [sessionParticipants, setSessionParticipants] = useState([
        { name: 'Dr. Elena Vance (Host)', role: 'Professional', isHost: true },
        { name: 'Marcus Thorne', role: 'Sponsor' },
        { name: 'Sarah Chen', role: 'Actioner' },
        { name: 'Devon Miller', role: 'Student' },
        { name: 'Chief Health Inspector', role: 'Authority' },
        { name: 'Critic Bot (AI)', role: 'Researcher', isAi: true }
      ]);
      const [activeSpeaker, setActiveSpeaker] = useState('Dr. Elena Vance (Host)');
      const [canvasNodes, setCanvasNodes] = useState([
        { id: 1, type: 'MindMapNode', text: '🌱 Optical NPK Soil Probe', x: 220, y: 110, color: '#86EFAC', author: 'Elena (Host)', votes: 14 },
        { id: 2, type: 'Sticky', text: 'Need sapphire optical glass window to resist scratches', x: 430, y: 60, color: '#FEF08A', author: 'Sarah (Actioner)', votes: 8 },
        { id: 3, type: 'Risk', text: '⚠️ Moisture condensation inside optical chamber in tropics', x: 430, y: 170, color: '#FECACA', author: 'Critic Bot (AI)', votes: 11 },
        { id: 4, type: 'Action', text: '✅ Integrate Gore-Tex acoustic breathable vent', x: 640, y: 170, color: '#BFDBFE', author: 'Elena (Host)', votes: 9 },
        { id: 5, type: 'SponsorPledge', text: '💎 Innovation Fund pledged $25,000 for 100 pilot PCB units', x: 220, y: 260, color: '#E9D5FF', author: 'Marcus (Sponsor)', votes: 16 }
      ]);
      const [sessionMessages, setSessionMessages] = useState([
        { sender: 'Dr. Elena Vance (Host)', role: 'Professional', text: 'Welcome everyone! Today we are extracting concrete execution work packages from our optical soil probe session.', time: '10:30 AM' },
        { sender: 'Marcus Thorne', role: 'Sponsor', text: 'Our innovation fund is ready to sponsor the 100 prototype units. Let us make sure follow-up tickets are pushed to Jira and GitHub.', time: '10:31 AM' },
        { sender: 'Critic Bot (AI)', role: 'Researcher', isAi: true, text: '⚠️ Risk flag: Firmware power profile must be verified before battery ordering.', time: '10:32 AM' },
        { sender: 'Sarah Chen', role: 'Actioner', text: 'I will take the IP67 waterproof enclosure task in Jira and sync PCB CAD files to GitHub.', time: '10:33 AM' }
      ]);
      const [decisions, setDecisions] = useState([
        { title: 'Adopt Nordic nRF52840 MCU with BLE + LoRaWAN', rationale: 'Lowest deep sleep current (1.8uA), enabling 18-month battery life with a 2W solar panel.', author: 'Elena Vance' },
        { title: 'Standardize on Swahili Dialect Audio Prompts', rationale: 'Overcomes literacy barriers and boosted cooperative fertilizer adherence to 88%.', author: 'Elena Vance' }
      ]);

      // Extraction Modal Working State
      const [extractTasks, setExtractTasks] = useState([
        { id: 101, title: 'Design & 3D print IP67 waterproof probe enclosure', tool: 'GitHub', assignee: 'Sarah Chen (Actioner)', priority: 'High', days: 4 },
        { id: 102, title: 'Quantize edge neural net for nutrient inference (64KB RAM)', tool: 'Jira', assignee: 'Elena Vance (Professional)', priority: 'High', days: 6 },
        { id: 103, title: 'Procure 100 units Nordic nRF52840 BLE/LoRa modules', tool: 'Trello', assignee: 'Marcus Thorne (Sponsor)', priority: 'Medium', days: 3 },
        { id: 104, title: 'Conduct regulatory calibration presentation with Agriculture Ministry', tool: 'Asana', assignee: 'Authority Lead', priority: 'Medium', days: 12 },
        { id: 105, title: 'Dispatch Twilio voice notification test across 40 trial handsets', tool: 'Linear', assignee: 'Devon Miller (Student)', priority: 'Low', days: 5 }
      ]);

      // Live Execution Kanban State (Closing the Loop)
      const [kanbanActions, setKanbanActions] = useState([
        { id: 1, title: 'Design IP67 waterproof probe enclosure', desc: 'Enclosure must protect optical lenses from dirt while allowing soil insertion.', status: 'Done', priority: 'High', tool: 'GitHub', ref: 'issue#12', url: 'https://github.com/arrayapp/soil-probe/issues/12', owner: 'Sarah Chen', impact: 'Enclosure successfully tested in 500-acre field trial.' },
        { id: 2, title: 'Compile quantized edge neural network', desc: 'Convert TensorFlow Lite model into C++ array runnable on 64KB MCU.', status: 'InProgress', priority: 'High', tool: 'Jira', ref: 'IDEA-104', url: 'https://jira.atlassian.net/browse/IDEA-104', owner: 'Elena Vance', impact: 'NPK inference accuracy validated at 94% r².' },
        { id: 3, title: 'Procure 100 units Nordic MCU modules', desc: 'Funded via Marcus Thorne sponsor pledge.', status: 'InProgress', priority: 'Medium', tool: 'Trello', ref: 'card-203', url: 'https://trello.com/c/card-203', owner: 'Marcus Thorne', impact: 'BOM cost kept under $40.' },
        { id: 4, title: 'Conduct regulatory safety presentation', desc: 'Present calibration data to safety and calibration board.', status: 'Todo', priority: 'Medium', tool: 'Asana', ref: 'asana-task-881', url: 'https://app.asana.com/0/1204/881', owner: 'Chief Inspector', impact: 'Required for national cooperative distribution.' },
        { id: 5, title: 'Voice notification test across 40 handsets', desc: 'Measure compliance between local dialect voice vs text SMS.', status: 'Done', priority: 'Low', tool: 'Linear', ref: 'LIN-302', url: 'https://linear.app/team/issue/LIN-302', owner: 'Devon Miller', impact: 'Audio voice prompt cohort achieved 88% adherence vs 47% SMS.' }
      ]);

      // Closed-Loop Participant Attribution Log
      const [participantAttributions, setParticipantAttributions] = useState([
        { name: 'Dr. Elena Vance (Host)', role: 'Professional', badge: 'Master Idea Builder', points: 1420, impactNarrative: 'Formulated core optical hypothesis in Session #1 -> Guided firmware architecture -> Pushed Jira IDEA-104 -> Realized 94% NPK estimation accuracy across 500 trial acres.' },
        { name: 'Marcus Thorne (Sponsor)', role: 'Sponsor', badge: 'Idea Sponsor & Patron', points: 980, impactNarrative: 'Pledged $25,000 funding in Session #2 -> Created Trello card-203 -> Financed 100 pilot sensor units saving cooperative farmers $45,000 in commercial testing fees.' },
        { name: 'Sarah Chen (Actioner)', role: 'Actioner', badge: 'Action Leader', points: 760, impactNarrative: 'Claimed IP67 mechanical task in Session #3 -> Pushed GitHub Issue #12 -> 3D printed durable enclosures that survived 30-day tropical field immersion.' },
        { name: 'Devon Miller (Student)', role: 'Student', badge: 'Knowledge Contributor', points: 410, impactNarrative: 'Asked soil moisture variance question in Session #3 -> Led to Linear LIN-302 dialect audio trial -> Proved 88% farmer adherence rate.' }
      ]);

      // Load initial Ideas
      useEffect(() => {
        fetch('/api/IdeaProducts')
          .then(r => r.json())
          .then(data => {
            setIdeas(data);
            if (data.length > 0) setSelectedIdea(data[0]);
          })
          .catch(e => console.error(e));
      }, []);

      // Handle Role Switch
      const handleRoleSwitch = (newRole) => {
        setCurrentUser(prev => ({ ...prev, role: newRole }));
        setSessionParticipants(prev => prev.map(p => p.name.includes(currentUser.name) ? { ...p, role: newRole } : p));
        setSessionMessages(prev => [...prev, {
          sender: 'System',
          role: 'System',
          text: `🔄 ${currentUser.name} self-assigned role as ${newRole}.`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);
      };

      // Add Canvas Node
      const addCanvasNode = (type, color, defaultText) => {
        const text = prompt(`Enter ${type} note text:`, defaultText || '');
        if (!text) return;
        const newNode = {
          id: Date.now(),
          type,
          text,
          x: 150 + Math.floor(Math.random() * 400),
          y: 80 + Math.floor(Math.random() * 200),
          color,
          author: `${currentUser.name} (${currentUser.role})`,
          votes: 1
        };
        setCanvasNodes(prev => [...prev, newNode]);
      };

      const voteCanvasNode = (nodeId) => {
        setCanvasNodes(prev => prev.map(n => n.id === nodeId ? { ...n, votes: n.votes + 1 } : n));
      };

      // Chat Message
      const [chatInput, setChatInput] = useState('');
      const handleSendChat = () => {
        if (!chatInput.trim()) return;
        const newMsg = {
          sender: `${currentUser.name}`,
          role: currentUser.role,
          text: chatInput,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setSessionMessages(prev => [...prev, newMsg]);
        setChatInput('');
        setActiveSpeaker(currentUser.name);
        setTimeout(() => setActiveSpeaker(''), 4000);
      };

      // Role-Specific Action Tool Handlers
      const handleSponsorPledge = () => {
        const amount = prompt('Enter sponsorship / grant pledge amount ($):', '25,000');
        if (!amount) return;
        const desc = prompt('Enter resource description:', '100 pilot PCB sensor boards & solar cells');
        addCanvasNode('SponsorPledge', '#E9D5FF', `💎 Sponsor Pledge: $${amount} - ${desc}`);
        setSessionMessages(prev => [...prev, {
          sender: currentUser.name,
          role: 'Sponsor',
          text: `🎉 PLEDGE ANNOUNCEMENT: Committing $${amount} and ${desc} towards this idea!`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);
      };

      const handleAuthoritySignoff = () => {
        const standard = prompt('Enter regulatory standard / compliance sign-off:', 'ISO-14040 Agricultural Sensor Standard');
        if (!standard) return;
        setDecisions(prev => [...prev, {
          title: `🏛️ Authority Approval: ${standard}`,
          rationale: `Formally signed off by ${currentUser.name} as compliant with regional precision agriculture guidelines.`,
          author: currentUser.name
        }]);
      };

      const handleActionerClaim = () => {
        const task = prompt('Enter engineering/action task to claim:', 'Assemble 20 PCB prototypes with Gore-Tex vents');
        if (!task) return;
        addCanvasNode('Action', '#BFDBFE', `🛠️ Claimed: ${task}`);
      };

      const handleProfessionalResolve = () => {
        const gap = prompt('Enter knowledge gap to resolve:', 'Wavelength calibration for volcanic soils');
        if (!gap) return;
        const solution = prompt('Enter technical resolution:', 'Applied dual-reference LED baseline offset algorithm.');
        setDecisions(prev => [...prev, {
          title: `🔬 Domain Knowledge Resolved: ${gap}`,
          rationale: solution,
          author: currentUser.name
        }]);
      };

      const handleStudentQuestion = () => {
        const q = prompt('Ask a clarifying question to the experts & AI:');
        if (!q) return;
        setSessionMessages(prev => [...prev, {
          sender: currentUser.name,
          role: 'Student',
          text: `🎓 LEARNER QUESTION: ${q}`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);
      };

      // Execute Extraction & Push to PM Tools (Closing the Loop)
      const handleConfirmExtractionAndPush = async () => {
        try {
          const res = await fetch('/api/IdeaSessions/1/extract-outcomes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId: 1,
              sessionNotes: 'Completed sprint review with 6 role-assigned contributors and AI facilitator. Extracted 5 follow-up execution tickets.',
              decisions: decisions.map(d => ({ ideaId: 1, summary: d.title, rationale: d.rationale, context: 'Live Session #3' })),
              actions: extractTasks.map(t => ({
                ideaId: 1,
                title: t.title,
                description: `Assigned during sprint to ${t.assignee}`,
                priority: t.priority === 'High' ? 2 : t.priority === 'Medium' ? 1 : 0,
                dueDate: new Date(Date.now() + t.days * 86400000).toISOString(),
                externalSystem: t.tool
              })),
              generateAiSummary: true
            })
          });

          const data = await res.json();
          setShowExtractModal(false);
          setSyncAlert({
            title: '🚀 Tickets Dispatched to External Tools & Stage Advanced!',
            message: `Successfully synchronized ${extractTasks.length} work items into Jira, GitHub, Trello, Asana, and Linear. Idea advanced to "Building" stage.`
          });

          // Switch to Kanban to view the execution loop
          setCurrentTab('kanban');
        } catch (err) {
          console.error(err);
          setShowExtractModal(false);
          setCurrentTab('kanban');
        }
      };

      // Simulate Two-Way External Webhook Callback (Closing the execution loop)
      const handleSimulateWebhook = (actionId, targetStatus) => {
        setKanbanActions(prev => prev.map(a => {
          if (a.id === actionId) {
            return {
              ...a,
              status: targetStatus,
              impact: targetStatus === 'Done' ? 'Completed & verified! Generated real-time cost savings and updated reputation score.' : a.impact
            };
          }
          return a;
        }));
        setSyncAlert({
          title: `⚡ Webhook Callback Received from External Tool!`,
          message: `Ticket #${actionId} updated to "${targetStatus}". Participant received +50 Reputation Points and closed the innovation realization loop!`
        });
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Global Top Navigation */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="h-10 w-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                <i className="fa-solid fa-cube text-white text-lg"></i>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold text-xl tracking-tight text-white">ArrayApp</span>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-brand-500/20 text-brand-400 border border-brand-500/30">.NET 10 & React</span>
                </div>
                <p className="text-xs text-slate-400">Closed-Loop Idea Cultivation, Maturation & Execution Ecosystem</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="flex items-center bg-slate-850 p-1.5 rounded-2xl border border-slate-750 space-x-1">
              <button onClick={() => setCurrentTab('session')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${currentTab === 'session' ? 'bg-purple-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-users-viewfinder"></i> Live Session Studio
              </button>
              <button onClick={() => setCurrentTab('kanban')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${currentTab === 'kanban' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-list-check"></i> Action & PM Sync
              </button>
              <button onClick={() => setCurrentTab('lifecycle')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${currentTab === 'lifecycle' ? 'bg-teal-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-timeline"></i> Lifecycle & Attribution
              </button>
              <button onClick={() => setCurrentTab('pipeline')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${currentTab === 'pipeline' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-seedling"></i> Maturation Pipeline
              </button>
              <button onClick={() => setCurrentTab('leaderboard')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${currentTab === 'leaderboard' ? 'bg-yellow-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-trophy"></i> Leaderboard & ROI
              </button>
            </nav>

            {/* Active Role Selector */}
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
                <span className="text-xs text-slate-400">Acting as:</span>
                <select 
                  value={currentUser.role} 
                  onChange={(e) => handleRoleSwitch(e.target.value)}
                  className="bg-slate-900 text-brand-400 font-bold text-xs rounded-lg px-2 py-1 border border-slate-700 focus:outline-none focus:border-brand-500"
                >
                  {ROLES.map(r => (
                    <option key={r.id} value={r.id}>{r.name}</option>
                  ))}
                </select>
              </div>
              <button onClick={() => setShowNewIdeaModal(true)} className="px-3.5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold flex items-center gap-2 shadow-lg shadow-brand-600/30 transition-all">
                <i className="fa-solid fa-plus"></i> Post Idea
              </button>
            </div>
          </header>

          {/* Real-time Notification Banner */}
          {syncAlert && (
            <div className="bg-brand-950/90 border-b border-brand-800 px-6 py-2.5 flex items-center justify-between text-xs text-brand-200">
              <div className="flex items-center gap-2">
                <i className="fa-solid fa-circle-check text-brand-400 text-sm"></i>
                <span className="font-bold">{syncAlert.title}</span>
                <span>{syncAlert.message}</span>
              </div>
              <button onClick={() => setSyncAlert(null)} className="text-slate-400 hover:text-white">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>
          )}

          {/* Main Workspace Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">

            {/* 1. LIVE COLLABORATIVE SESSION STUDIO */}
            {currentTab === 'session' && (
              <div className="space-y-6">
                {/* Session Header Banner */}
                <div className="p-5 rounded-3xl bg-gradient-to-r from-slate-900 via-slate-850 to-slate-900 border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <div className="flex items-center gap-2.5">
                      <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black bg-rose-500/20 text-rose-400 border border-rose-500/30 animate-pulse">
                        <span className="h-2 w-2 rounded-full bg-rose-500"></span> LIVE VIRTUAL WORKSHOP
                      </span>
                      <span className="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                        Idea #1: Soil & Crop Health Monitor
                      </span>
                    </div>
                    <h1 className="text-xl font-black text-white mt-2">AI Soil Probe Hardware & Firmware Sprint #3</h1>
                    <p className="text-xs text-slate-400 mt-0.5">Originator: Dr. Elena Vance • 6 Role-Assigned Collaborators • Live 2D Mind-Map Canvas • AI Critic Facilitator</p>
                  </div>

                        <div className="pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                          <div className="flex items-center gap-3">
                            <span><i className="fa-solid fa-circle-question text-amber-400"></i> {idea.openGapsCount}</span>
                            <span><i className="fa-solid fa-flask text-pink-400"></i> {idea.experimentsCount}</span>
                            <span><i className="fa-solid fa-bolt text-blue-400"></i> {idea.completedActionsCount}/{idea.actionsCount}</span>
                          </div>
                          <button onClick={() => setCurrentTab('session')} className="px-3 py-1.5 bg-purple-600/20 text-purple-300 hover:bg-purple-600/30 rounded-xl text-xs font-bold">
                            Join Workshop
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 5. LEADERBOARD & ROI TAB */}
            {currentTab === 'leaderboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="p-5 rounded-3xl bg-slate-900 border border-slate-800">
                    <p className="text-xs text-slate-400 font-semibold">Total Cost Savings Realized</p>
                    <h3 className="text-2xl font-black text-white mt-1">$45,000+</h3>
                    <p className="text-[11px] text-brand-400 mt-0.5"><i className="fa-solid fa-arrow-trend-up"></i> Tested on 500+ acres</p>
                  </div>
                  <div className="p-5 rounded-3xl bg-slate-900 border border-slate-800">
                    <p className="text-xs text-slate-400 font-semibold">Average ROI Realized</p>
                    <h3 className="text-2xl font-black text-brand-400 mt-1">210%</h3>
                    <p className="text-[11px] text-slate-400 mt-0.5">Across hardware prototypes</p>
                  </div>
                  <div className="p-5 rounded-3xl bg-slate-900 border border-slate-800">
                    <p className="text-xs text-slate-400 font-semibold">Impacted Users / Beneficiaries</p>
                    <h3 className="text-2xl font-black text-white mt-1">650+ Farmers</h3>
                    <p className="text-[11px] text-sky-400 mt-0.5">3 active pilot cooperatives</p>
                  </div>
                  <div className="p-5 rounded-3xl bg-slate-900 border border-slate-800">
                    <p className="text-xs text-slate-400 font-semibold">Actions Completed</p>
                    <h3 className="text-2xl font-black text-purple-400 mt-1">41 / 48</h3>
                    <p className="text-[11px] text-slate-400 mt-0.5">85% execution completion</p>
                  </div>
                </div>

                <div className="p-6 rounded-3xl bg-slate-900 border border-slate-800 space-y-4">
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-trophy text-yellow-400"></i> Impact Leadership Board
                  </h2>
                  <div className="space-y-2">
                    {participantAttributions.map((p, idx) => (
                      <div key={idx} className="p-4 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between text-xs">
                        <div className="flex items-center gap-3">
                          <span className="font-black text-yellow-400 text-sm">#{idx + 1}</span>
                          <div>
                            <p className="font-bold text-white">{p.name}</p>
                            <p className="text-[11px] text-slate-400">{p.badge}</p>
                          </div>
                        </div>
                        <span className="font-black text-brand-400 text-sm">{p.points.toLocaleString()} pts</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* EXTRACT OUTCOMES & DISPATCH TO PM TOOLS MODAL */}
          {showExtractModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto scrollbar-thin p-6 space-y-6">
                <div className="flex items-start justify-between border-b border-slate-800 pb-4">
                  <div>
                    <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-purple-950 text-purple-300 border border-purple-800">
                      Post-Session AI Synthesis & PM Dispatcher
                    </span>
                    <h2 className="text-xl font-black text-white mt-1.5">Extract Actionable Outcomes & Push to Execution</h2>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Review extracted tasks and select target project management tool (Jira, GitHub, Trello, Asana, Linear) for automatic dispatch.
                    </p>
                  </div>
                  <button onClick={() => setShowExtractModal(false)} className="text-slate-400 hover:text-white text-lg">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                {/* Ratified Decisions to Commit */}
                <div className="space-y-2">
                  <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Ratified Decisions to Register ({decisions.length}):</span>
                  {decisions.map((d, idx) => (
                    <div key={idx} className="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs">
                      <p className="font-bold text-white">✅ {d.title}</p>
                      <p className="text-[11px] text-slate-400 mt-0.5">{d.rationale}</p>
                    </div>
                  ))}
                </div>

                {/* Action Items with PM Tool Selector */}
                <div className="space-y-3">
                  <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Execution Work Packages ({extractTasks.length}):</span>
                  {extractTasks.map((t, idx) => (
                    <div key={t.id} className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-3 text-xs">
                      <div className="space-y-1">
                        <p className="font-bold text-white">{t.title}</p>
                        <p className="text-[11px] text-slate-400">Assigned to: <strong className="text-slate-200">{t.assignee}</strong> • Estimate: {t.days} days</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-[11px] text-slate-400">Push to:</span>
                        <select 
                          value={t.tool} 
                          onChange={(e) => {
                            const val = e.target.value;
                            setExtractTasks(prev => prev.map(item => item.id === t.id ? { ...item, tool: val } : item));
                          }}
                          className="bg-slate-900 border border-slate-700 text-brand-400 font-bold rounded-xl px-2.5 py-1 text-xs focus:outline-none focus:border-brand-500"
                        >
                          <option value="Jira">Jira 🟦</option>
                          <option value="GitHub">GitHub ⬛</option>
                          <option value="Trello">Trello 🔵</option>
                          <option value="Asana">Asana 🔴</option>
                          <option value="Linear">Linear 🟣</option>
                          <option value="Monday">Monday 🟨</option>
                        </select>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                  <button onClick={() => setShowExtractModal(false)} className="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl">
                    Cancel
                  </button>
                  <button onClick={handleConfirmExtractionAndPush} className="px-6 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-black rounded-2xl shadow-lg shadow-purple-600/30 flex items-center gap-2">
                    <i className="fa-solid fa-paper-plane"></i> Dispatch All Tickets & Advance Stage to "Building"
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
