<!DOCTYPE html>
<html lang="en">
<head>

  <!-- React 18 & Babel CDN -->

  <!-- Tailwind CSS CDN -->

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- SignalR Client -->

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf4', 100: '#dcfce7', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d' },
            slate: { 750: '#293548', 850: '#151e2e', 950: '#090d16' }

    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .scrollbar-thin::-webkit-scrollbar { width: 5px; height: 5px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .stage-pill { font-size: 0.68rem; padding: 2px 8px; border-radius: 9999px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const NAVIGATION_MODULES = [
      { id: 'campaigns', name: 'Campaigns & Ideas', icon: 'fa-lightbulb', color: 'text-amber-400' },
      { id: 'canvas', name: 'Live Workshop Studio', icon: 'fa-chalkboard-user', color: 'text-brand-400' },
      { id: 'chatrooms', name: 'Persistent Chatrooms', icon: 'fa-comments', color: 'text-sky-400' },
      { id: 'roles', name: '10-Role Matrix', icon: 'fa-users', color: 'text-purple-400' },
      { id: 'ai-studio', name: 'AI Co-Workers & Triage', icon: 'fa-brain', color: 'text-indigo-400' },
      { id: 'kanban', name: 'Execution & PM Sync', icon: 'fa-list-check', color: 'text-rose-400' },
      { id: 'leaderboard', name: 'Leaderboard & Rewards', icon: 'fa-trophy', color: 'text-yellow-400' },
      { id: 'metrics', name: 'Executive ROI Metrics', icon: 'fa-chart-pie', color: 'text-emerald-400' }
    ];

    const ROLES = [
      { id: 'Student', name: 'Student / Novice', desc: 'Learns, asks clarifying questions, explores the domain', icon: 'fa-graduation-cap', color: 'text-amber-400 bg-amber-950/60 border-amber-800' },
      { id: 'Sponsor', name: 'Sponsor / Patron', desc: 'Provides funding ($25k+), resources, access, or commercial backing', icon: 'fa-gem', color: 'text-purple-400 bg-purple-950/60 border-purple-800' },
      { id: 'Professional', name: 'Professional / Expert', desc: 'Provides specialist technical guidance & resolves blindspots (+75 pts)', icon: 'fa-microscope', color: 'text-blue-400 bg-blue-950/60 border-blue-800' },
      { id: 'Authority', name: 'Authority / Stakeholder', desc: 'Ensures institutional, regulatory, policy, or safety sign-offs', icon: 'fa-landmark', color: 'text-rose-400 bg-rose-950/60 border-rose-800' },
      { id: 'Actioner', name: 'Actioner / Implementer', desc: 'Commits to prototypes, code, CAD models, and execution sprints', icon: 'fa-screwdriver-wrench', color: 'text-emerald-400 bg-emerald-950/60 border-emerald-800' },
      { id: 'Audience', name: 'Audience / Observer', desc: 'Observes, reacts, votes in polls, and validates sentiment', icon: 'fa-users', color: 'text-slate-300 bg-slate-800/60 border-slate-700' },
      { id: 'Researcher', name: 'Researcher', desc: 'Investigates academic evidence, patents, and domain unknowns', icon: 'fa-book-bookmark', color: 'text-cyan-400 bg-cyan-950/60 border-cyan-800' },
      { id: 'Creator', name: 'Creator / Designer', desc: 'Develops product concepts, UI/UX artifacts, and interactive schematics', icon: 'fa-palette', color: 'text-pink-400 bg-pink-950/60 border-pink-800' },
      { id: 'Experimenter', name: 'Experimenter', desc: 'Designs A/B validation tests and logs empirical sensor metrics', icon: 'fa-flask-vial', color: 'text-orange-400 bg-orange-950/60 border-orange-800' },
      { id: 'Connector', name: 'Connector / Partner', desc: 'Introduces industrial supply partners, enterprise buyers, and opportunities', icon: 'fa-handshake', color: 'text-teal-400 bg-teal-950/60 border-teal-800' }
    ];

    const SESSION_FORMATS = [
      { id: 'brainstorm', name: 'Live Brainstorm (SCAMPER & Crazy 8s)', icon: 'fa-lightbulb' },
      { id: 'review', name: 'Expert Technical Review', icon: 'fa-microscope' },
      { id: 'critique', name: 'Product & Risk Critique', icon: 'fa-shield-halved' },
      { id: 'pitch', name: 'Investor & Sponsor Pitch', icon: 'fa-gem' },
      { id: 'decision', name: 'Executive Decision Meeting', icon: 'fa-gavel' }
    ];

    function App() {
      const [currentTab, setCurrentTab] = useState('campaigns');
      const [currentUser, setCurrentUser] = useState({ id: 'user-elena', name: 'Dr. Elena Vance', role: 'Professional', points: 1420 });
      const [selectedFormat, setSelectedFormat] = useState('brainstorm');
      const [syncAlert, setSyncAlert] = useState(null);
      const [floatingEmojis, setFloatingEmojis] = useState([]);
      const [showCertModal, setShowCertModal] = useState(false);
      const [showIdeaBotModal, setShowIdeaBotModal] = useState(false);
      const [showStructureModal, setShowStructureModal] = useState(false);
      const [ideaBotInput, setIdeaBotInput] = useState('');
      const [ideaBotHistory, setIdeaBotHistory] = useState([
        { sender: 'IdeaBot (AI)', isAi: true, text: 'Hello! I am your 24/7 Idea Assistant. How can I assist your concept maturation today? (e.g. patent search, grant drafting, technical architecture)' }
      ]);

      // Nudge bar state
      const [nudgeIdx, setNudgeIdx] = useState(0);
      const nudges = [
        { title: '🔥 Trending Momentum!', msg: 'Idea "Soil & Crop Health Monitor" is 3 upvotes away from the #1 spot!', cta: 'Vote Now' },
        { title: '🎯 Domain Bounty (+75 pts)', msg: 'New knowledge gap: "Optical Calibration in High-Salinity Coastal Soils".', cta: 'Solve Gap' },
        { title: '🏆 Milestone Achieved!', msg: 'Sarah Chen is 1 task execution away from the "Action Champion" badge!', cta: 'View Tasks' }
      ];

      // 10 Structured Dimensions State for Active Idea
      const [ideaStructure, setIdeaStructure] = useState({
        title: 'Soil & Crop Health Monitor',
        tagline: 'Sub-$50 optical spectrometry array for real-time localized soil & fertilizer management',
        problem: 'Smallholder farmers overspend up to 40% on incorrect fertilizer blends due to 3-week lab delays and $100/test pricing.',
        opportunity: '$14.2B global precision agriculture opportunity across 500M underserved smallholder farms.',
        hypothesis: 'A sub-$50 pulsed multi-spectral optical probe running edge TinyML inference can deliver 92% accurate NPK fertilizer guidance in < 60 seconds.',
        audience: 'Sub-Saharan and South Asian smallholder cooperatives, agronomy extension officers, and agricultural input distributors.',
        valueProp: 'Eliminates 3-week lab turnaround, cuts fertilizer wastage by 35%, and increases annual crop yield by 18-24%.',
        constraints: 'Low-power battery operation (< 50mW), ruggedized IP67 waterproof enclosure, and cost bill-of-materials cap at $48.',
        unknowns: 'Long-term optical window scratching in volcanic abrasive clay soils; temperature drift calibration in direct equatorial sunlight.',
        evidence: 'Validated on 150 soil samples against ICP-OES spectroscopy standards with R² = 0.941 correlation.',
        questions: '1. Which optical coating resists volcanic abrasive wear best? 2. How to ensure offline calibration without cloud sync?',
        desiredOutcome: 'Manufacture 100 field-pilot units, complete cooperative trials across 500 trial acres, and publish open hardware spec.'
      });

      // Live Canvas Nodes State
      const [canvasNodes, setCanvasNodes] = useState([
        { id: 1, type: 'MindMapNode', text: '🌱 Soil & Crop Health Monitor', x: 50, y: 50, color: 'bg-emerald-950/90 border-emerald-500 text-emerald-300', votes: 24 },
        { id: 2, type: 'Sticky', text: 'Sub-$50 Optical Spectrometry BOM with Sapphire Window', x: 320, y: 30, color: 'bg-yellow-950/90 border-yellow-500 text-yellow-200', votes: 15 },
        { id: 3, type: 'Sticky', text: 'Quantized 64KB RAM Edge Neural Inference Engine', x: 320, y: 150, color: 'bg-blue-950/90 border-blue-500 text-blue-200', votes: 18 },
        { id: 4, type: 'Risk', text: '⚠️ Optical window fouling in volcanic clay soils', x: 600, y: 90, color: 'bg-rose-950/90 border-rose-500 text-rose-200', votes: 9 }
      ]);

      // Trigger floating emoji reaction
      const handleTriggerReaction = (emoji) => {
        const id = Date.now() + Math.random();
        setFloatingEmojis(prev => [...prev, { id, emoji, left: Math.random() * 80 + 10 }]);
        setTimeout(() => {
          setFloatingEmojis(prev => prev.filter(e => e.id !== id));
        }, 1800);
      };

      const handleAiSeedGeneration = () => {
        const newNode = {
          id: Date.now(),
          type: 'Sticky',
          text: '🤖 AI Seed: Swahili dialect audio guidance for smallholder fertilizer compliance.',
          x: 200 + Math.random() * 300,
          y: 80 + Math.random() * 120,
          color: 'bg-purple-950/90 border-purple-500 text-purple-200',
          votes: 12
        };
        setCanvasNodes(prev => [...prev, newNode]);
        setSyncAlert({
          title: '✨ AI Seed Card Generated!',
          message: 'Synthesized new perspective from agricultural adoption case studies.'
        });
      };

      const handleRoleAction = (roleId) => {
        let msg = '';
        if (roleId === 'Student') msg = 'Submitted question to Dr. Elena Vance: "How does baseline subtraction handle heavy moisture?"';
        else if (roleId === 'Sponsor') msg = 'Pledged $25,000 grant milestone for the first 100 prototype units!';
        else if (roleId === 'Professional') msg = 'Resolved domain gap: Uploaded optical calibration curve for coastal saline soils (+75 pts)!';
        else if (roleId === 'Authority') msg = 'Approved ISO-14040 safety and environmental compliance certification.';
        else if (roleId === 'Actioner') msg = 'Claimed task: "Convert quantized TinyML model to C++ array on Nordic MCU".';
        else if (roleId === 'Researcher') msg = 'Published academic prior art: "US Patent 10,845,302B2 Non-Infringement Analysis".';
        else if (roleId === 'Creator') msg = 'Uploaded 3D CAD schematic for IP67 ruggedized probe casing.';
        else if (roleId === 'Experimenter') msg = 'Logged empirical trial metric: "NPK detection accuracy = 93.4% on 20 loam samples".';
        else if (roleId === 'Connector') msg = 'Introduced partnership lead with Regional Smallholder Farming Cooperative.';
        else msg = 'Cast vote in live consensus poll: 100% agreement on proceeding to Sprint 2.';

        setSyncAlert({
          title: `⚡ Role Action Executed (${roleId})`,
          message: msg
        });
      };

      const handleSendIdeaBot = () => {
        if (!ideaBotInput.trim()) return;
        const query = ideaBotInput;
        setIdeaBotHistory(prev => [...prev, { sender: currentUser.name, text: query }]);
        setIdeaBotInput('');

        setTimeout(() => {
          if (query.toLowerCase().includes('patent')) {
            setIdeaBotHistory(prev => [...prev, {
              sender: 'IdeaBot (AI)',
              isAi: true,
              text: `🔍 Patent Search: Found US Patent 10,845,302B2 ("Portable multi-spectral optical soil analyzer"). No direct infringement found for our pulsed narrow-band architecture.`
            }]);
          } else if (query.toLowerCase().includes('grant') || query.toLowerCase().includes('proposal')) {
            setIdeaBotHistory(prev => [...prev, {
              sender: 'IdeaBot (AI)',
              isAi: true,
              text: `📄 Grant Draft Section:\n"Project Summary: Deploys 100 low-cost optical NPK probes to eliminate 40% fertilizer waste. Requested Budget: $25,000 for field pilot across 500 trial acres."`
            }]);
          } else {
            setIdeaBotHistory(prev => [...prev, {
              sender: 'IdeaBot (AI)',
              isAi: true,
              text: `💡 IdeaBot: Decomposing "${query}" into 2 assignable tasks: (1) Draft schematic RFC, (2) Sync Jira issue IDEA-105.`
            }]);
          }
        }, 800);
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/95 backdrop-blur sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="h-10 w-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                <i className="fa-solid fa-cube text-white text-lg"></i>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold text-xl tracking-tight text-white">IdeaApp</span>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-brand-500/20 text-brand-400 border border-brand-500/30">.NET 10 & React</span>
                </div>
                <p className="text-xs text-slate-400">Idea Cultivation, Maturation & Work Orchestration Platform</p>
              </div>
            </div>

            {/* Nav Tabs */}
            <nav className="flex items-center bg-slate-850 p-1.5 rounded-2xl border border-slate-750 space-x-1 overflow-x-auto scrollbar-thin">
              {NAVIGATION_MODULES.map(m => (
                <button
                  key={m.id}
                  onClick={() => setCurrentTab(m.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 whitespace-nowrap ${currentTab === m.id ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}
                >
                  <i className={`fa-solid ${m.icon} ${currentTab === m.id ? 'text-white' : m.color}`}></i>
                  <span>{m.name}</span>
                </button>
              ))}
            </nav>

            <div className="flex items-center gap-3">
              <button 
                onClick={() => setShowStructureModal(true)}
                className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-brand-400 border border-slate-700 text-xs font-bold rounded-xl shadow-sm flex items-center gap-1.5"
              >
                <i className="fa-solid fa-sliders"></i> 10-D Idea Wizard
              </button>

              <button 
                onClick={() => setShowIdeaBotModal(true)}
                className="px-3.5 py-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-bold rounded-xl shadow-md flex items-center gap-1.5"
              >
                <i className="fa-solid fa-headset"></i> 24/7 IdeaBot
              </button>

              <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
                <span className="text-xs text-brand-400 font-bold">{currentUser.name}</span>
                <select
                  value={currentUser.role}
                  onChange={(e) => setCurrentUser(prev => ({ ...prev, role: e.target.value }))}
                  className="bg-slate-900 text-slate-300 text-[11px] font-bold rounded px-1.5 py-0.5 border border-slate-700 focus:outline-none"
                >
                  {ROLES.map(r => (
                    <option key={r.id} value={r.id}>{r.name}</option>
                  ))}
                </select>
              </div>
            </div>
          </header>

          {/* Gamified Nudge Bar */}
          <div className="bg-gradient-to-r from-purple-950/80 via-slate-900 to-slate-900 border-b border-purple-800/40 px-6 py-1.5 flex items-center justify-between text-xs">
            <div className="flex items-center gap-2">
              <span className="font-bold text-purple-300 flex items-center gap-1.5">
                <i className="fa-solid fa-bell text-amber-400"></i> {nudges[nudgeIdx].title}
              </span>
              <span className="text-slate-300">{nudges[nudgeIdx].msg}</span>
            </div>
            <button 
              onClick={() => setNudgeIdx((nudgeIdx + 1) % nudges.length)}
              className="text-[10px] px-2 py-0.5 bg-purple-900/50 text-purple-200 border border-purple-700/60 rounded-lg hover:bg-purple-800"
            >
              Next Alert →
            </button>
          </div>

          {/* Toast */}
          {syncAlert && (
            <div className="bg-brand-950/90 border-b border-brand-800 px-6 py-2.5 flex items-center justify-between text-xs text-brand-200">
              <div className="flex items-center gap-2">
                <i className="fa-solid fa-circle-check text-brand-400 text-sm"></i>
                <span className="font-bold">{syncAlert.title}</span>
                <span>{syncAlert.message}</span>
              </div>
              <button onClick={() => setSyncAlert(null)} className="text-slate-400 hover:text-white">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>
          )}

          {/* Floating Emoji Container */}
          <div className="fixed bottom-10 right-10 pointer-events-none z-50">
            {floatingEmojis.map(item => (
              <div key={item.id} className="absolute float-emoji text-3xl" style={{ right: `${item.left}px` }}>
                {item.emoji}
              </div>
            ))}
          </div>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">

            {/* 1. CAMPAIGNS & IDEAS */}
            {currentTab === 'campaigns' && (
              <div className="space-y-6">
                <div className="p-6 rounded-3xl bg-slate-900 border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-950 text-amber-300 border border-amber-800">
                      INNOVATION CHALLENGES & CAMPAIGNS
                    </span>
                    <h1 className="text-xl font-black text-white mt-1.5 flex items-center gap-2">
                      <i className="fa-solid fa-lightbulb text-amber-400"></i> Active Challenge Statements & Ideas
                    </h1>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Submit raw ideas against open challenges or crowdsource community expertise to fill domain blindspots.
                    </p>
                  </div>
                  <button 
                    onClick={() => setShowStructureModal(true)}
                    className="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md"
                  >
                    <i className="fa-solid fa-plus"></i> Submit 10-D Idea Product
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* Campaign Card 1 */}
                  <div className="p-5 rounded-3xl bg-slate-900 border border-slate-800 space-y-3 flex flex-col justify-between">
                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-950 text-emerald-300 border border-emerald-800">Agri-Tech Challenge</span>
                        <span className="text-xs font-black text-brand-400">$30,000 Pool</span>
                      </div>
                      <h3 className="text-base font-bold text-white">{ideaStructure.title}</h3>
                      <p className="text-xs text-slate-400">{ideaStructure.tagline}</p>
                      <div className="pt-2 border-t border-slate-800/80 text-[11px] text-slate-500 space-y-0.5">
                        <p>Champion: <strong className="text-slate-300">Dr. Elena Vance (Professional)</strong></p>
                        <p>ICE Score: <strong className="text-brand-400">47.6 / 100</strong> • 42 Supporters</p>
                      </div>
                    </div>
                    <div className="space-y-2">
                      <button onClick={() => setShowStructureModal(true)} className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-brand-400 border border-slate-700 rounded-xl text-xs font-bold">
                        View 10-D Structure
                      </button>
                      <button onClick={() => setCurrentTab('canvas')} className="w-full py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-bold">
                        Enter Live Workshop Studio
                      </button>
                    </div>
                  </div>

                  {/* Campaign Card 2 */}
                  <div className="p-5 rounded-3xl bg-slate-900 border border-slate-800 space-y-3 flex flex-col justify-between">
                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-950 text-blue-300 border border-blue-800">Clean Energy Challenge</span>
                        <span className="text-xs font-black text-brand-400">$50,000 Pool</span>
                      </div>
                      <h3 className="text-base font-bold text-white">Micro-Grid Energy Exchange</h3>
                      <p className="text-xs text-slate-400">Autonomous P2P clean power trading with sub-10ms frequency stabilization.</p>
                      <div className="pt-2 border-t border-slate-800/80 text-[11px] text-slate-500 space-y-0.5">
                        <p>Champion: <strong className="text-slate-300">Marcus Thorne (Sponsor)</strong></p>
                        <p>ICE Score: <strong className="text-brand-400">42.0 / 100</strong> • 29 Supporters</p>
                      </div>
                    </div>
                    <button onClick={() => setCurrentTab('chatrooms')} className="w-full py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-xs font-bold">
                      Open Discussion Forum
                    </button>
                  </div>

                  {/* Campaign Card 3 */}
                  <div className="p-5 rounded-3xl bg-slate-900 border border-slate-800 space-y-3 flex flex-col justify-between">
                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-purple-950 text-purple-300 border border-purple-800">Health Diagnostics</span>
                        <span className="text-xs font-black text-brand-400">$25,000 Pool</span>
                      </div>
                      <h3 className="text-base font-bold text-white">Point-of-Care Retinal AI Diagnostics</h3>
                      <p className="text-xs text-slate-400">Offline diabetic retinopathy edge inference on battery-powered CM4.</p>
                      <div className="pt-2 border-t border-slate-800/80 text-[11px] text-slate-500 space-y-0.5">
                        <p>Champion: <strong className="text-slate-300">Sarah Chen (Actioner)</strong></p>
                        <p>ICE Score: <strong className="text-brand-400">51.2 / 100</strong> • 36 Supporters</p>
                      </div>
                    </div>
                    <button onClick={() => setCurrentTab('kanban')} className="w-full py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold">
                      View Execution Tasks
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 2. LIVE WORKSHOP STUDIO (2D Canvas + Floating Reactions + Voice) */}
            {currentTab === 'canvas' && (
              <div className="space-y-6">
                <div className="p-6 rounded-3xl bg-slate-900 border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-xl font-black text-white flex items-center gap-2">
                      <i className="fa-solid fa-chalkboard-user text-brand-400"></i> Live Workshop Studio: {ideaStructure.title}
                    </h1>
                    <div className="flex items-center gap-3 mt-1.5">
                      <span className="text-xs text-slate-400">Session Format:</span>
                      <div className="flex gap-1">
                        {SESSION_FORMATS.map(f => (
                          <button

                </div>

                <div className="flex-1 overflow-y-auto scrollbar-thin space-y-3 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-xs">
                  {ideaBotHistory.map((m, i) => (
                    <div key={i} className={`p-3 rounded-2xl max-w-lg ${m.isAi ? 'bg-slate-900 text-slate-200 mr-auto border border-slate-800' : 'bg-purple-600/30 text-purple-100 ml-auto border border-purple-500/40'}`}>
                      <span className="text-[10px] font-bold text-purple-400 block mb-1">{m.sender}</span>
                      <p className="whitespace-pre-line leading-relaxed">{m.text}</p>
                    </div>
                  ))}
                </div>

                <div className="flex gap-2 pt-2 border-t border-slate-800">
                  <input
                    type="text"
                    value={ideaBotInput}
                    onChange={(e) => setIdeaBotInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendIdeaBot()}
                    placeholder="Ask IdeaBot (e.g. patent search, draft grant section, SWOT)..."
                    className="flex-1 bg-slate-950 border border-slate-800 text-xs rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-purple-500"
                  />
                  <button onClick={handleSendIdeaBot} className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold">
                    <i className="fa-solid fa-paper-plane"></i>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* REALIZATION CERTIFICATE MODAL */}
          {showCertModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-yellow-500/40 rounded-3xl max-w-2xl w-full p-8 space-y-6 relative shadow-2xl">
                <button onClick={() => setShowCertModal(false)} className="absolute top-5 right-5 text-slate-400 hover:text-white">
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <div className="text-center space-y-2 border-b border-yellow-500/20 pb-4">
                  <div className="h-12 w-12 rounded-2xl bg-yellow-500/20 border border-yellow-500/40 text-yellow-400 flex items-center justify-center text-xl mx-auto">
                    <i className="fa-solid fa-award"></i>
                  </div>
                  <span className="text-[10px] font-black uppercase tracking-widest text-yellow-400">Verifiable Innovation Credential</span>
                  <h2 className="text-2xl font-black text-white">Certificate of Idea Realization</h2>
                  <p className="text-xs text-slate-400 font-mono">CERT-1-2026-ARRAY-EXEC</p>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-1">
                    <span className="text-[10px] text-slate-500 uppercase font-bold">Realized Innovation:</span>
                    <h3 className="text-base font-bold text-white">{ideaStructure.title}</h3>
                    <p className="text-slate-300">Successfully matured from raw concept through live collaborative workshops, knowledge gap resolution, external PM dispatch (Jira/GitHub), and field validation.</p>
                  </div>

                  <div className="grid grid-cols-3 gap-3 text-center">
                    <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                      <span className="text-[9px] text-slate-500 uppercase font-bold block">Idea Originator</span>
                      <strong className="text-white text-xs">Dr. Elena Vance</strong>
                    </div>
                    <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                      <span className="text-[9px] text-slate-500 uppercase font-bold block">Sponsor Patron</span>
                      <strong className="text-purple-400 text-xs">Marcus Thorne</strong>
                    </div>
                    <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                      <span className="text-[9px] text-slate-500 uppercase font-bold block">Action Lead</span>
                      <strong className="text-emerald-400 text-xs">Sarah Chen</strong>
                    </div>
                  </div>

                  <div className="p-3 rounded-xl bg-brand-950/30 border border-brand-800/40 flex justify-between items-center">
                    <span className="text-brand-300 font-bold">Realized Impact & ROI:</span>
                    <span className="text-brand-400 font-black">$45,000 Saved • 210% ROI across 500 Trial Acres</span>
                  </div>
                </div>

                <div className="flex justify-between items-center pt-3 border-t border-slate-800 text-[10px] text-slate-500">
                  <span>Issued: August 27, 2026</span>
                  <span className="font-mono">SHA256: 8f4b...39e1 [Verified on ArrayApp Engine]</span>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
